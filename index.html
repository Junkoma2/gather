<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gather</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel input-panel">
        <header>
          <h1>gather</h1>
        </header>

        <form id="thought-form" class="thought-form">
          <label>
            <span>名前</span>
            <input id="title-input" type="text" maxlength="24" placeholder="考えの名前" required />
          </label>

          <label>
            <span>メモ</span>
            <textarea id="note-input" maxlength="240" placeholder="少しだけ残す"></textarea>
          </label>

          <label>
            <span>色</span>
            <input id="color-input" type="color" value="#5b7cfa" />
          </label>

          <label>
            <span>大きさ</span>
            <input id="size-input" type="range" min="18" max="64" value="32" />
          </label>

          <button type="submit">追加</button>
        </form>
      </aside>

      <section class="canvas-panel" aria-label="思考の場">
        <canvas id="gather-canvas"></canvas>
      </section>

      <aside class="panel detail-panel">
        <h2>選択中</h2>
        <div id="empty-detail" class="empty-detail">円を選ぶと、ここに内容が表示されます。</div>
        <article id="thought-detail" class="thought-detail" hidden>
          <div class="detail-heading">
            <span id="detail-color" class="detail-color"></span>
            <h3 id="detail-title"></h3>
          </div>
          <p id="detail-note"></p>
          <dl>
            <div>
              <dt>大きさ</dt>
              <dd id="detail-size"></dd>
            </div>
          </dl>
          <div class="detail-actions">
            <button id="delete-thought" type="button">削除</button>
          </div>
        </article>
      </aside>
    </main>

    <script src="./script.js"></script>
  </body>
</html>

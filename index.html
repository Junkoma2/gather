<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>gather</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1>gather</h1>
        <div class="header-actions">
          <div class="menu-wrapper">
            <button id="menu-button" class="icon-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-haspopup="true">⋮</button>
            <div class="action-menu" role="menu" hidden>
              <div class="blend-control">
                <button id="blend-mode" class="action-menu-item" type="button" role="menuitem" aria-label="2つの円を選んで色を近づける">つなぐ</button>
                <input id="blend-strength" type="range" min="1" max="100" value="30" aria-label="色の近づき度合い" />
              </div>
              <button id="check-update" type="button" role="menuitem" aria-label="更新を確認">更新を確認</button>
              <button id="export-data" type="button" role="menuitem" aria-label="エクスポート">エクスポート</button>
              <button id="import-data" type="button" role="menuitem" aria-label="インポート">インポート</button>
            </div>
          </div>
          <input id="import-file" type="file" accept="application/json" hidden />
          <button id="add-thought" class="icon-button add-button" type="button" aria-label="考えを追加">
            +
          </button>
        </div>
      </header>

      <section class="canvas-panel" aria-label="思考の場">
        <canvas id="gather-canvas"></canvas>
      </section>
    </main>

    <dialog id="thought-dialog" class="thought-dialog">
      <form id="thought-form" class="thought-form">
        <div class="dialog-header">
          <h2 id="dialog-title">考えを追加</h2>
          <button id="close-dialog" class="icon-button" type="button" aria-label="閉じる">×</button>
        </div>

        <label>
          <span>名前</span>
          <input id="title-input" type="text" maxlength="24" placeholder="考えの名前" required />
        </label>

        <label>
          <span>メモ</span>
          <textarea id="note-input" maxlength="240" placeholder="少しだけ残す"></textarea>
        </label>


        <fieldset class="color-fieldset">
          <legend>色</legend>
          <div class="rgb-sliders">
            <label class="rgb-label">
              <span>R</span>
              <input id="color-r" type="range" min="0" max="255" value="127" class="rgb-slider rgb-r" aria-label="赤（Red）" />
              <output id="color-r-value" class="rgb-value">127</output>
            </label>
            <label class="rgb-label">
              <span>G</span>
              <input id="color-g" type="range" min="0" max="255" value="183" class="rgb-slider rgb-g" aria-label="緑（Green）" />
              <output id="color-g-value" class="rgb-value">183</output>
            </label>
            <label class="rgb-label">
              <span>B</span>
              <input id="color-b" type="range" min="0" max="255" value="190" class="rgb-slider rgb-b" aria-label="青（Blue）" />
              <output id="color-b-value" class="rgb-value">190</output>
            </label>
          </div>
          <div class="color-preview-row">
            <span class="color-preview-swatch" id="color-preview-swatch"></span>
          </div>
          <input id="color-input" type="color" value="#7fb7be" hidden />
        </fieldset>


        <div class="size-field">
          <span>大きさ</span>
          <div class="size-slider-row">
            <input id="size-input" type="range" min="18" max="64" value="32" />
            <svg id="size-preview" class="size-preview" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
              <circle id="size-preview-circle" cx="32" cy="32" r="16" fill="#7fb7be" opacity="0.72" />
            </svg>
          </div>
          <div class="size-labels" aria-hidden="true">
            <span>小</span>
            <span>大</span>
          </div>
        </div>

        <div class="dialog-actions">
          <button id="delete-thought" class="secondary-button danger-button" type="button">削除</button>
          <button id="duplicate-thought" class="secondary-button" type="button" hidden>複製</button>
          <button id="save-thought" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <!-- 円タップ時アクションメニュー -->
    <div id="circle-action-menu" class="circle-action-menu" hidden role="menu" aria-label="円のアクション">
      <button id="circle-edit" type="button" role="menuitem">編集</button>
      <button id="circle-delete" type="button" role="menuitem" class="danger">削除</button>
    </div>

    <!-- ドラッグ重なり時「つなぐ」ポップアップ -->
    <div id="blend-popup" class="blend-popup" hidden role="dialog" aria-label="色をつなぐ">
      <span class="blend-popup-label">色を近づけますか？</span>
      <div class="blend-popup-actions">
        <button id="blend-popup-confirm" type="button">つなぐ</button>
        <button id="blend-popup-cancel" type="button" class="secondary">キャンセル</button>
      </div>
    </div>

    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    <script src="./script.js"></script>
  </body>
</html>
